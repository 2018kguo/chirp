[package]
name = "chirp"
version = "0.4.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/2018kguo/chirp"
description = "A voice engine that serves many calls per process"

[features]
# Count live heap bytes and serve them at /debug/heap (benchmarks).
heap-stats = []
# Heap profile (dhat-heap.json, written on SIGTERM): where the bytes are.
dhat-heap = ["dep:dhat"]
# Allocator experiment (bench_load reports RSS per call); Linux uses jemalloc.
mimalloc = ["dep:mimalloc"]

[dependencies]
opus = "0.4"
# Pure-Rust DTLS/SRTP: no native crypto build.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
libc = "0.2"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
dhat = { version = "0.3", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
futures = "0.3"
ort = { version = "=2.0.0-rc.15", features = ["download-binaries"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  # No "http2": OpenAI caps a connection at 100 streams and hyper queues
  # requests past that instead of opening another connection, so replies at
  # scale would wait in line. HTTP/1.1 keep-alive already reuses connections.
] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v5", "v7"] }

hound = "3"

[profile.release]
lto = "thin"
codegen-units = 1

# jemalloc on Linux: the lowest resident memory per call of glibc, glibc with
# MALLOC_ARENA_MAX=2, mimalloc and jemalloc (scripts/linux_memory.sh; PLAN.md).
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
