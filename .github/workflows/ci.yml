name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy && rustup default 1.96.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo run --release --locked --bin fetch_models
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - uses: astral-sh/setup-uv@v5
      # Smart Turn's int8 kernels round differently per CPU (ARM dot product,
      # x86 VNNI), so the same-ORT reference turn_parity checks against is
      # recomputed here, on the machine running the test.
      - run: uv run --project reference python scripts/turn_reference.py
      - run: cargo test --release --locked
